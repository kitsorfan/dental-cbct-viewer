  <header class="topbar" id="topbar">
    <div class="brand"><svg class="logo"><use href="#i-logo"/></svg><span data-i18n="app.name">Dental CBCT Viewer</span></div>
    <button id="openBtn" class="primary with-icon" data-i18n-title="open.title" data-i18n-aria="open"><svg><use href="#i-folder"/></svg><span data-i18n="open">Open scan…</span></button>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
    <input type="file" id="fileInput" multiple hidden>
    <select id="series" hidden></select>
    <div class="patient" id="patient"></div>
    <div class="segmented tools" role="toolbar">
      <button data-tool="navigate" data-i18n-title="tool.navigate.title" data-i18n-aria="tool.navigate"><svg><use href="#i-navigate"/></svg></button>
      <button data-tool="scroll" data-i18n-title="tool.scroll.title" data-i18n-aria="tool.scroll"><svg><use href="#i-scroll"/></svg></button>
      <button data-tool="wl" data-i18n-title="tool.wl.title" data-i18n-aria="tool.wl"><svg><use href="#i-wl"/></svg></button>
      <button data-tool="pan" data-i18n-title="tool.pan.title" data-i18n-aria="tool.pan"><svg><use href="#i-pan"/></svg></button>
      <button data-tool="zoom" data-i18n-title="tool.zoom.title" data-i18n-aria="tool.zoom"><svg><use href="#i-zoom"/></svg></button>
      <button data-tool="measure" data-i18n-title="tool.measure.title" data-i18n-aria="tool.measure"><svg><use href="#i-ruler"/></svg></button>
      <button data-tool="angle" data-i18n-title="tool.angle.title" data-i18n-aria="tool.angle"><svg><use href="#i-angle"/></svg></button>
      <button data-tool="arch" data-i18n-title="tool.arch.title" data-i18n-aria="tool.arch"><svg><use href="#i-arch"/></svg></button>
    </div>
    <div class="group display-group">
      <select id="preset" data-i18n-title="preset.title" data-i18n-aria="preset.title"></select>
      <button id="invert" class="icon bordered" data-i18n-title="invert.title" data-i18n-aria="invert.title"><svg><use href="#i-invert"/></svg></button>
    </div>
    <!-- Inline on wide screens; a menu behind the ⋯ button on narrow ones. -->
    <div class="more" id="more">
      <div class="group">
        <label class="switch" data-i18n-title="canals.title"><input type="checkbox" id="showCanals" checked><span data-i18n="canals">Canals</span></label>
        <label class="switch" data-i18n-title="guides.title"><input type="checkbox" id="showGuides" checked><span data-i18n="guides">Guides</span></label>
      </div>
      <div class="group">
        <button id="clearMeasures" class="icon bordered" data-i18n-title="clear.title" data-i18n-aria="clear.title"><svg><use href="#i-eraser"/></svg></button>
        <button id="resetViews" class="icon bordered" data-i18n-title="reset.title" data-i18n-aria="reset.title"><svg><use href="#i-reset"/></svg></button>
      </div>
      <div class="group needs-scan">
        <button id="snapshotBtn" class="with-icon" data-i18n-title="snapshot.title"><svg><use href="#i-layout"/></svg><span data-i18n="snapshot">Snapshot</span></button>
      </div>
      <div class="group help-group">
        <label class="lang" data-i18n-title="lang.title"><svg><use href="#i-globe"/></svg><select id="lang" data-i18n-aria="lang.title"></select></label>
        <button id="helpBtn" class="icon bordered" data-i18n-title="help.button" data-i18n-aria="help.button"><svg><use href="#i-help"/></svg></button>
        <button id="aboutBtn" class="icon bordered" data-i18n-title="about.button" data-i18n-aria="about.button"><svg><use href="#i-info"/></svg></button>
      </div>
    </div>
    <div class="group needs-scan report-group">
      <button id="reportBtn" class="with-icon accent" data-i18n-title="report.button.title" data-i18n-aria="report.button"><svg><use href="#i-pdf"/></svg><span data-i18n="report.button">PDF report</span></button>
    </div>
    <button id="moreBtn" class="icon bordered" data-i18n-title="more.title" data-i18n-aria="more.title" aria-expanded="false" aria-controls="more"><svg><use href="#i-more"/></svg></button>
  </header>

  <main id="grid" class="grid">
    <section class="view" data-view="pano">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.pano">Panoramic</span><span class="vinfo"></span>
        <div class="vctl">
          <select id="arch" data-i18n-title="pano.arch.title"></select>
          <label class="range" data-i18n-title="pano.thickness.title"><span data-i18n="pano.thickness">Thickness</span>
            <input type="range" id="panoThick" min="0" max="30" step="0.5" value="8">
            <output id="panoThickOut">8 mm</output>
          </label>
          <select id="panoMode" data-i18n-title="pano.mode.title">
            <option value="avg" data-i18n="pano.avg">Average</option>
            <option value="mip" data-i18n="pano.mip">MIP</option>
          </select>
        </div>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="vr">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.vr">3D</span><span class="vinfo"></span>
        <div class="vctl">
          <select id="vrPreset" data-i18n-title="vr.mode.title">
            <option value="bone" data-i18n="vr.bone">Bone surface</option>
            <option value="teeth" data-i18n="vr.teeth">Teeth surface</option>
            <option value="mip" data-i18n="vr.mip">MIP</option>
            <option value="xray" data-i18n="vr.xray">X-ray</option>
          </select>
          <label class="range" data-i18n-title="vr.level.title">
            <input type="range" id="vrLevel" min="0" max="1" step="0.005" value="0.3">
            <output id="vrLevelOut"></output>
          </label>
        </div>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="axial">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.axial">Axial</span><span class="vinfo"></span>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="cross">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.cross">Cross-section</span><span class="vinfo"></span>
        <div class="vctl">
          <select id="csStep" data-i18n-title="cs.step.title"></select>
          <select id="csWidth" data-i18n-title="cs.width.title">
            <option value="30">30 mm</option>
            <option value="40" selected>40 mm</option>
            <option value="60">60 mm</option>
          </select>
        </div>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="coronal">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.coronal">Coronal</span><span class="vinfo"></span>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="sagittal">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.sagittal">Sagittal</span><span class="vinfo"></span>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>
  </main>

  <!-- Phones show the panoramic and one other view, chosen here. -->
  <nav class="viewtabs" id="viewtabs" role="tablist" data-i18n-aria="viewtabs.title">
    <button role="tab" data-show="cross" data-i18n="view.cross.short">Cross-section</button>
    <button role="tab" data-show="axial" data-i18n="view.axial">Axial</button>
    <button role="tab" data-show="coronal" data-i18n="view.coronal">Coronal</button>
    <button role="tab" data-show="sagittal" data-i18n="view.sagittal">Sagittal</button>
    <button role="tab" data-show="vr" data-i18n="view.vr">3D</button>
  </nav>

  <footer class="status">
    <span id="statusHover"></span>
    <span id="statusMsg"></span>
    <button id="privacyBadge" class="badge" data-i18n-title="tab.privacy"><svg><use href="#i-shield"/></svg><span data-i18n="privacy.badge"></span></button>
    <span id="statusWL"></span>
  </footer>

  <div id="welcome" class="welcome" hidden>
    <div class="card">
      <svg class="logo big"><use href="#i-logo"/></svg>
      <h1 data-i18n="welcome.title">Open a CBCT scan</h1>
      <p data-i18n-html="welcome.body"></p>
      <div class="actions">
        <button id="welcomeOpen" class="primary big with-icon"><svg><use href="#i-folder"/></svg><span data-i18n="welcome.choose">Choose folder…</span></button>
        <button id="welcomeFiles" class="big ghost with-icon"><svg><use href="#i-zip"/></svg><span data-i18n="welcome.files">Open ZIP or files…</span></button>
        <button id="welcomeDemo" class="big ghost" data-i18n="welcome.demo">Synthetic demo jaw</button>
      </div>
      <div class="real-demo">
        <a id="welcomeReal" class="with-icon" target="_blank" rel="noopener noreferrer"><svg><use href="#i-download"/></svg><span id="welcomeRealLabel"></span></a>
        <p data-i18n="welcome.real.note"></p>
      </div>
      <p class="hint" data-i18n="welcome.hint"></p>
