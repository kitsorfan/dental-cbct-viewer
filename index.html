<!doctype html>
<html lang="en" data-build="dev">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open-source dental CBCT viewer that runs in the browser: panoramic, cross-sections, 3D, measurements and PDF reports. Scans never leave your computer.">
  <title>Dental CBCT Viewer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2311161c'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%232ec4b6' stroke-linejoin='round'%3E%3Cpath stroke-width='1.8' d='M7.2 3.2c-2.4 0-4.2 1.9-4.2 4.4 0 2.4.9 4.2 1.8 6.2.8 1.8 1.1 3.8 1.5 5.8.3 1.5 1 2.4 2 2.4 1.2 0 1.7-1.1 2-2.6l.5-2.6c.2-1 .7-1.5 1.2-1.5s1 .5 1.2 1.5l.5 2.6c.3 1.5.8 2.6 2 2.6 1 0 1.7-.9 2-2.4.4-2 .7-4 1.5-5.8.9-2 1.8-3.8 1.8-6.2 0-2.5-1.8-4.4-4.2-4.4-1.7 0-2.6.9-4.8.9s-3.1-.9-4.8-.9z'/%3E%3Cpath stroke-width='1.5' stroke-dasharray='2 1.6' d='M.8 10.6h22.4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/style.css">
</head>
<body data-tool="navigate">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M7.2 3.2c-2.4 0-4.2 1.9-4.2 4.4 0 2.4.9 4.2 1.8 6.2.8 1.8 1.1 3.8 1.5 5.8.3 1.5 1 2.4 2 2.4 1.2 0 1.7-1.1 2-2.6l.5-2.6c.2-1 .7-1.5 1.2-1.5s1 .5 1.2 1.5l.5 2.6c.3 1.5.8 2.6 2 2.6 1 0 1.7-.9 2-2.4.4-2 .7-4 1.5-5.8.9-2 1.8-3.8 1.8-6.2 0-2.5-1.8-4.4-4.2-4.4-1.7 0-2.6.9-4.8.9s-3.1-.9-4.8-.9z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 1.6" d="M.8 10.6h22.4"/>
    </symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M3.5 8h3.5l1.8-2.6h6.4L17 8h3.5v11h-17z"/><circle cx="12" cy="13.2" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 11h18M10 11v9M15.5 11v9M14 4v7"/></g></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20h11M5.1 14.3l8.2-8.2a2 2 0 0 1 2.8 0l3 3a2 2 0 0 1 0 2.8L12.4 18.6a2 2 0 0 1-1.4.6H9.3a2 2 0 0 1-1.4-.6l-2.8-2.8a1 1 0 0 1 0-1.5z"/><path d="M10 9.5l5 5"/></g></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4"/><path d="M4.5 4.5v4h4"/></g></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8.5L19 7.5V21H6z"/><path d="M14 3v5h5M9 13h7M9 16.5h7"/></g></symbol>
  </svg>

  <header class="topbar">
    <div class="brand"><svg class="logo"><use href="#i-logo"/></svg><span data-i18n="app.name">Dental CBCT Viewer</span></div>
    <button id="openBtn" class="primary" data-i18n="open" data-i18n-title="open.title">Open scan…</button>
    <input type="file" id="folderInput" webkitdirectory multiple hidden>
    <select id="series" hidden></select>
    <div class="patient" id="patient"></div>
    <div class="group tools" role="toolbar">
      <button data-tool="navigate" data-i18n="tool.navigate" data-i18n-title="tool.navigate.title">Navigate</button>
      <button data-tool="wl" data-i18n="tool.wl" data-i18n-title="tool.wl.title">W/L</button>
      <button data-tool="pan" data-i18n="tool.pan" data-i18n-title="tool.pan.title">Pan</button>
      <button data-tool="zoom" data-i18n="tool.zoom" data-i18n-title="tool.zoom.title">Zoom</button>
      <button data-tool="measure" data-i18n="tool.measure" data-i18n-title="tool.measure.title">Measure</button>
      <button data-tool="angle" data-i18n="tool.angle" data-i18n-title="tool.angle.title">Angle</button>
      <button data-tool="arch" data-i18n="tool.arch" data-i18n-title="tool.arch.title">Draw arch</button>
    </div>
    <div class="group">
      <select id="preset" data-i18n-title="preset.title"></select>
      <button id="invert" data-i18n="invert" data-i18n-title="invert.title">Invert</button>
    </div>
    <div class="group">
      <label class="toggle" data-i18n-title="canals.title"><input type="checkbox" id="showCanals" checked> <span data-i18n="canals">Canals</span></label>
      <label class="toggle" data-i18n-title="guides.title"><input type="checkbox" id="showGuides" checked> <span data-i18n="guides">Guides</span></label>
    </div>
    <div class="group">
      <button id="clearMeasures" class="icon bordered" data-i18n-title="clear.title"><svg><use href="#i-eraser"/></svg></button>
      <button id="resetViews" class="icon bordered" data-i18n-title="reset.title"><svg><use href="#i-reset"/></svg></button>
    </div>
    <div class="group needs-scan">
      <button id="snapshotBtn" class="with-icon" data-i18n-title="snapshot.title"><svg><use href="#i-layout"/></svg><span data-i18n="snapshot">Snapshot</span></button>
      <button id="reportBtn" class="with-icon accent" data-i18n-title="report.button.title"><svg><use href="#i-pdf"/></svg><span data-i18n="report.button">PDF report</span></button>
    </div>
    <div class="group">
      <select id="lang" data-i18n-title="lang.title">
        <option value="en">EN</option>
        <option value="el">ΕΛ</option>
      </select>
      <button id="helpBtn" data-i18n-title="help.button">?</button>
    </div>
  </header>

  <main id="grid" class="grid">
    <section class="view" data-view="pano">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.pano">Panoramic</span><span class="vinfo"></span>
        <div class="vctl">
          <select id="arch" data-i18n-title="pano.arch.title"></select>
          <label data-i18n-title="pano.thickness.title"><span data-i18n="pano.thickness">Thickness</span>
            <input type="range" id="panoThick" min="0" max="30" step="0.5" value="8">
            <output id="panoThickOut">8 mm</output>
          </label>
          <select id="panoMode" data-i18n-title="pano.mode.title">
            <option value="avg" data-i18n="pano.avg">Average</option>
            <option value="mip" data-i18n="pano.mip">MIP</option>
          </select>
        </div>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="vr">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.vr">3D</span><span class="vinfo"></span>
        <div class="vctl">
          <select id="vrPreset" data-i18n-title="vr.mode.title">
            <option value="bone" data-i18n="vr.bone">Bone surface</option>
            <option value="teeth" data-i18n="vr.teeth">Teeth surface</option>
            <option value="mip" data-i18n="vr.mip">MIP</option>
            <option value="xray" data-i18n="vr.xray">X-ray</option>
          </select>
          <input type="range" id="vrLevel" min="0" max="1" step="0.005" value="0.3" data-i18n-title="vr.level.title">
          <output id="vrLevelOut"></output>
        </div>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="axial">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.axial">Axial</span><span class="vinfo"></span>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="cross">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.cross">Cross-section</span><span class="vinfo"></span>
        <div class="vctl">
          <select id="csWidth" data-i18n-title="cs.width.title">
            <option value="30">30 mm</option>
            <option value="40" selected>40 mm</option>
            <option value="60">60 mm</option>
          </select>
        </div>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="coronal">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.coronal">Coronal</span><span class="vinfo"></span>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>

    <section class="view" data-view="sagittal">
      <div class="vhead">
        <span class="dot"></span><span class="vtitle" data-i18n="view.sagittal">Sagittal</span><span class="vinfo"></span>
        <div class="vbtns"><button class="icon save" data-i18n-title="save.title"><svg><use href="#i-camera"/></svg></button><button class="icon expand"><svg class="i-expand"><use href="#i-expand"/></svg><svg class="i-collapse"><use href="#i-collapse"/></svg></button></div>
      </div>
      <div class="canvas-wrap"><canvas></canvas></div>
    </section>
  </main>

  <footer class="status">
    <span id="statusHover"></span>
    <span id="statusMsg"></span>
    <span id="statusWL"></span>
  </footer>

  <div id="welcome" class="welcome" hidden>
    <div class="card">
      <svg class="logo big"><use href="#i-logo"/></svg>
      <h1 data-i18n="welcome.title">Open a CBCT scan</h1>
      <p data-i18n-html="welcome.body"></p>
      <div class="actions">
        <button id="welcomeOpen" class="primary big" data-i18n="welcome.choose">Choose folder…</button>
        <button id="welcomeDemo" class="big ghost" data-i18n="welcome.demo">Try the demo scan</button>
      </div>
      <p class="hint" data-i18n="welcome.hint"></p>
      <p class="error" id="welcomeError" hidden></p>
    </div>
  </div>

  <div class="drop-hint"><div data-i18n="drop">Drop the scan folder to open it</div></div>

  <div id="loading" class="loading" hidden>
    <div class="box">
      <div id="loadingLabel"></div>
      <div class="bar"><div id="loadingBar"></div></div>
    </div>
  </div>

  <div id="help" class="help" hidden>
    <div class="sheet">
      <button class="close" aria-label="Close">×</button>
      <h2 data-i18n="help.heading">Controls</h2>
      <div class="cols">
        <dl>
          <dt data-i18n="help.left.k"></dt><dd data-i18n="help.left.v"></dd>
          <dt data-i18n="help.wheel.k"></dt><dd data-i18n="help.wheel.v"></dd>
          <dt data-i18n="help.shiftwheel.k"></dt><dd data-i18n="help.shiftwheel.v"></dd>
          <dt data-i18n="help.right.k"></dt><dd data-i18n="help.right.v"></dd>
          <dt data-i18n="help.middle.k"></dt><dd data-i18n="help.middle.v"></dd>
          <dt data-i18n="help.ctrlwheel.k"></dt><dd data-i18n="help.ctrlwheel.v"></dd>
          <dt data-i18n="help.dbl.k"></dt><dd data-i18n="help.dbl.v"></dd>
        </dl>
        <dl>
          <dt data-i18n="help.3d.k"></dt><dd data-i18n="help.3d.v"></dd>
          <dt data-i18n="help.keys.k"></dt><dd data-i18n="help.keys.v"></dd>
          <dt data-i18n="help.arrows.k"></dt><dd data-i18n="help.arrows.v"></dd>
          <dt data-i18n="help.f.k"></dt><dd data-i18n="help.f.v"></dd>
          <dt data-i18n="help.toggles.k"></dt><dd data-i18n="help.toggles.v"></dd>
          <dt data-i18n="help.del.k"></dt><dd data-i18n="help.del.v"></dd>
          <dt data-i18n="help.esc.k"></dt><dd data-i18n="help.esc.v"></dd>
        </dl>
      </div>
      <p class="note" data-i18n="help.note"></p>
      <p class="note" data-i18n="help.disclaimer"></p>
      <p class="links">
        <a id="offlineLink" download="dental-cbct-viewer.html" hidden data-i18n="help.offline">Download for offline use</a>
        <a id="sourceLink" target="_blank" rel="noopener" data-i18n="help.source">Source code</a>
      </p>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
